<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Song Transition Diagnostics</title>
</head>
<body style="background: #111; color: #0f0; margin: 0; padding: 20px;">
  <div id="log" style="white-space: pre-wrap; font-family: monospace; font-size: 13px;"></div>
  <iframe id="game-frame" src="index.html" style="width: 600px; height: 400px; border: 1px solid #333; margin-top: 15px;"></iframe>
  <script type="module">
    const logEl = document.getElementById('log');
    function log(msg) {
      console.log(msg); fetch("http://127.0.0.1:3002", {method: "POST", body: msg}).catch(() => {});
      logEl.textContent += msg + '\n';
    }

    const frame = document.getElementById('game-frame');
    frame.onload = async () => {
      log("Iframe loaded. Waiting for debug object and songs...");
      const win = frame.contentWindow;

      let dbg = null;
      for (let i = 0; i < 40; i++) {
        await new Promise(r => setTimeout(r, 250));
        if (win.__gameDebug && win.__gameDebug.songsDB().length > 0) {
          dbg = win.__gameDebug;
          break;
        }
      }

      if (!dbg) {
        log("Timeout waiting for __gameDebug or tracks.");
        return;
      }

      const songs = dbg.songsDB();
      log(`Found ${songs.length} tracks in songsDB!`);
      songs.forEach((s, idx) => log(`  [${idx}] "${s.title}" (${s.duration}) url=${s.audioUrl?.substring(0, 40)}...`));

      // Test sequence 1: Start Track 0
      log("\n--- Starting Track 0 ---");
      dbg.startGame(0);
      
      // Wait for audio analysis and play
      for (let i = 0; i < 30; i++) {
        await new Promise(r => setTimeout(r, 200));
        if (dbg.State.isPlaying) break;
      }
      log(`Track 0 isPlaying=${dbg.State.isPlaying}, mapTiles=${dbg.State.mapTiles?.length}, activeTiles=${dbg.State.activeTiles?.length}, nextSpawnIndex=${dbg.State.nextSpawnIndex}, startTime=${dbg.State.startTime}, audioCtxTime=${dbg.State.audioCtx?.currentTime}`);

      await new Promise(r => setTimeout(r, 1000));
      log(`After 1s: activeTiles=${dbg.State.activeTiles?.length}, nextSpawnIndex=${dbg.State.nextSpawnIndex}, score=${dbg.State.score}`);

      // Now pass the level: simulate victory endGame(true)
      log("\n--- Simulating Level Completion: endGame(true) ---");
      await dbg.endGame(true);
      log(`After endGame: isPlaying=${dbg.State.isPlaying}, resultScreenVisible=${!win.document.getElementById('result-screen')?.classList.contains('hidden')}`);

      // Now user clicks "В меню" (quitGame)
      log("\n--- Simulating 'В меню' (quitGame) ---");
      dbg.quitGame();
      log(`After quitGame: in-game=${win.document.body.classList.contains('in-game')}, menuVisible=${!win.document.getElementById('menu-layer')?.classList.contains('hidden')}`);

      // Now user starts ANOTHER track (Track 1, or Track 0 again if only 1 exists)
      const nextIdx = songs.length > 1 ? 1 : 0;
      log(`\n--- Starting Track ${nextIdx} ---`);
      dbg.startGame(nextIdx);

      // Wait for audio analysis and play
      for (let i = 0; i < 30; i++) {
        await new Promise(r => setTimeout(r, 200));
        if (dbg.State.isPlaying) break;
      }
      log(`Track ${nextIdx} isPlaying=${dbg.State.isPlaying}, mapTiles=${dbg.State.mapTiles?.length}, activeTiles=${dbg.State.activeTiles?.length}, nextSpawnIndex=${dbg.State.nextSpawnIndex}, startTime=${dbg.State.startTime}, audioCtxTime=${dbg.State.audioCtx?.currentTime}`);

      for (let s = 1; s <= 3; s++) {
        await new Promise(r => setTimeout(r, 1000));
        log(`Track ${nextIdx} +${s}s: activeTiles=${dbg.State.activeTiles?.length}, nextSpawnIndex=${dbg.State.nextSpawnIndex}, mapTilesLength=${dbg.State.mapTiles?.length}`);
      }

      log("\n=== TEST FINISHED ===");
    };
  </script>
</body>
</html>
