<!doctype html><html lang="en"><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Piano theme verification</title><style>body{margin:20px;background:#071020;color:#dceaff;font:16px system-ui}canvas{max-width:100%;height:auto;border:1px solid #334155}button{padding:12px;margin:10px}</style><h1>Blade, flame and dragon verification</h1><p>Six live combo tiers: ×1, ×2, ×4, ×6, ×8, ×10. Dragon rows: full, half fade, near completion.</p><button id="bench">Measure mobile rendering budget</button><button id="flames">Measure four scabbard flames</button><button id="pause">Pause animation</button><p id="results">Ready</p><canvas width="720" height="1300"></canvas><script type="module">
import {SANHUA_THEME as S} from '../src/game/themes/sanhua.js';
import {HADO99_THEME as H} from '../src/game/themes/hado99.js';
window.GameState={isMobile:true,combo:0};
const c=document.querySelector('canvas'),ctx=c.getContext('2d');const combos=[0,50,100,200,400,800];const tile={hit:true,holding:true};let paused=false;
function render(now){ctx.globalAlpha=1;ctx.fillStyle='#071020';ctx.fillRect(0,0,720,1300);for(let i=0;i<6;i++){const x=i*120+16,combo=combos[i];ctx.fillStyle='#cbd5e1';ctx.fillText('Combo '+combo,x,24);S.drawHoldBody(ctx,x,80,86,44,tile,false,now,220,combo,300);S.drawHoldTail(ctx,x,80,86,44,tile,false,now,220,combo,300);S.drawNeck(ctx,x,300,86,44,tile,false,combo);for(let row=0;row<3;row++){const y=610+row*260;ctx.save();ctx.globalAlpha=H.getHoldOpacity(tile,[150,60,15][row]);H.drawHoldBody(ctx,x,y-70,86,44,tile,false,now,70,combo,y);H.drawHoldTail(ctx,x,y-70,86,44,tile,false,now,70,combo,y);H.drawNeck(ctx,x,y,86,44,tile,false,combo);H.bakeLongHead(ctx,x,y,86,44,false,{tier:combo});H.drawHeadOverlay?.(ctx,x,y,86,44,tile,false,now,combo);ctx.restore();}}}
function loop(now){if(!paused)render(now);requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Resume animation':'Pause animation'};
document.querySelector('#bench').onclick=()=>{const samples=[];for(let j=0;j<20;j++)render(j*16.67);for(let j=0;j<180;j++){const t=performance.now();render(j*16.67);samples.push(performance.now()-t)}samples.sort((a,b)=>a-b);document.querySelector('#results').textContent='Six Sanhua + 18 dragon renders per sample, mobile detail: median '+samples[90].toFixed(2)+' ms; p95 '+samples[171].toFixed(2)+' ms; max '+samples[179].toFixed(2)+' ms. CPU Canvas submission on this desktop browser; physical mobile GPU timing still requires device profiling.'};
document.querySelector('#flames').onclick=()=>{paused=true;const samples=[];let frame=0;const measure=now=>{ctx.clearRect(0,0,720,1300);const start=performance.now();for(let i=0;i<4;i++)S.drawNeck(ctx,i*100+20,250,86,44,tile,false,800);const elapsed=performance.now()-start;if(frame++>20)samples.push(elapsed);if(samples.length<120)requestAnimationFrame(measure);else{samples.sort((a,b)=>a-b);document.querySelector('#results').textContent='Four active scabbards at ×10, mobile detail, 120 separate frames: median '+samples[60].toFixed(2)+' ms; p95 '+samples[114].toFixed(2)+' ms; max '+samples[119].toFixed(2)+' ms CPU submission. Device profiling required for full GPU frame time.';paused=false;}};requestAnimationFrame(measure)};
window.addEventListener('error',e=>document.querySelector('#results').textContent='ERROR: '+e.message);
</script></html>
