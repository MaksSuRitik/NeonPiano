<!doctype html><meta charset="utf-8"><title>Profile and leaderboard layout</title>
<link rel="stylesheet" href="../../css/style.css"><link rel="stylesheet" href="../../css/social-panels.css">
<style>body{display:block!important;overflow:auto!important;padding:12px!important;height:auto!important;min-height:100vh} .user-profile-card{margin:auto}.leaderboard-modal{position:relative;top:auto;left:auto;transform:none;margin:auto;width:100%!important;max-height:none!important} #tools{display:flex;gap:12px;padding:12px}iframe{height:1300px;border:0;background:#0b1221}#samples{display:flex;gap:20px;align-items:start} .fixture-profile{max-height:none!important}</style>
<style>iframe{flex-shrink:0} .avatar-photo{background:#ad7957}</style>
<div id="tools"><button id="light">Light / Dark</button><a href="?profile">Profile</a><a href="?leaderboard">Leaderboard</a></div><main></main>
<script type="module">
const params=new URLSearchParams(location.search), root=document.querySelector('main');
document.querySelector('#light').onclick=()=>document.body.dataset.theme=document.body.dataset.theme==='light'?'dark':'light';
if(params.has('width')){const frame=document.createElement('iframe');frame.width=String(Math.max(320,Math.min(1100,Number(params.get('width'))||390)));frame.src=params.get('panel')==='profile'?'?profile':'?leaderboard';frame.title='Responsive preview';root.append(frame);}
else if(!params.size){root.id='samples';root.innerHTML='<iframe title="Mobile profile" width="390" src="?profile"></iframe><iframe title="Mobile leaderboard" width="390" src="?leaderboard"></iframe><iframe title="Desktop leaderboard" width="900" src="?leaderboard"></iframe>';}
else if(params.has('profile')){
 const doc=new DOMParser().parseFromString(await(await fetch('../../index.html')).text(),'text/html');
 const card=doc.querySelector('.user-profile-card');card.classList.add('fixture-profile');root.append(card);
 const set=(id,value)=>card.querySelector('#'+id).textContent=value;
 set('up-name','regis');set('up-title-badge','Хозяин сцены');set('up-rank-badge','#1');set('up-stat-score','25 393 113');set('up-stat-levels','42');set('up-stat-stars','110');set('up-stat-diamonds','107');set('up-stat-playtime','8 ч 42 мин');set('up-favorite-track-title','Phrolova ost Theme — The Lost Beyond');
 const frame=['champion-crown','silver-crown','leader-crown','eared-melon'].includes(params.get('frame'))?params.get('frame'):'eared-melon';
 card.querySelector('#up-avatar').className='user-profile-avatar frame-'+frame;
 card.querySelector('#up-avatar').innerHTML='<img class="avatar-photo" src="../../assets/themes/phrolova.png" alt="Preview avatar">';
 set('up-name','Kolyann');set('up-rank-badge','#4');set('up-bio-display','«Дыня это вкусно.»');
 if(params.has('owner'))for(const id of ['up-avatar-edit-btn','up-avatar-reset-btn','up-bio-edit-box','up-favorite-track-controls'])card.querySelector('#'+id).classList.remove('hidden');
 set('up-avatar-edit-btn','✎');set('up-avatar-reset-btn','×');set('up-bio-save-btn','✓');card.querySelector('#up-bio-input').value='Кря';
}else{
  const top3 = [
    { name: 'Kai', rank: 2, frame: 'silver-crown', title: 'Мастер комбо', score: '10 641 314', icon: '♜', label: 'SILVER', step: '2' },
    { name: 'regis', rank: 1, frame: 'champion-crown', title: 'Хозяин сцены', score: '25 393 113', icon: '♛', label: 'CHAMPION', step: '1' },
    { name: 'Des1gner', rank: 3, frame: 'leader-crown', title: 'Мастер комбо', score: '5 826 772', icon: '♜', label: 'BRONZE', step: '3' }
  ];
  const podiumHtml = top3.map(p => `
    <div class="podium-card podium-rank-${p.rank}">
      <div class="podium-card-top">
        <div class="podium-rank-badge rank-${p.rank}">
          <span class="podium-crown-icon">${p.icon}</span>
          <span class="podium-rank-num">#${p.rank}</span>
        </div>
        <div class="podium-tier-label">${p.label}</div>
      </div>
      <div class="podium-avatar-stage">
        <div class="podium-avatar frame-${p.frame}">${p.name[0]}</div>
      </div>
      <div class="podium-player-details">
        <div class="podium-name">${p.name}</div>
        <div class="podium-title-wrap"><span class="podium-title-badge">${p.title}</span></div>
        <div class="podium-score-wrap">
          <div class="podium-score">${p.score}</div>
          <div class="podium-levels">42 Уровня</div>
        </div>
      </div>
      <div class="podium-pedestal-base">
        <span class="podium-base-num">${p.step}</span>
      </div>
    </div>
  `).join('');

  const others = [
    { name: 'Kolyann', frame: 'champion-crown', title: 'Демон скорости', score: '4 006 722', lv: 15 },
    { name: 'LongPlayerName123456789', frame: 'eared-melon', title: 'Демон скорости', score: '3 850 110', lv: 15 },
    { name: 'Shadow', frame: 'eared-melon', title: 'Ритм-рыцарь', score: '3 420 900', lv: 14 },
    { name: 'Valkyrie', frame: 'silver-crown', title: 'Повелитель нот', score: '2 980 400', lv: 12 },
    { name: 'StormBringer', frame: 'leader-crown', title: 'Ас клавиатуры', score: '2 540 200', lv: 11 },
    { name: 'CyberSamurai', frame: 'eared-melon', title: 'Новачок біту', score: '2 100 000', lv: 10 },
    { name: 'Phoenix', frame: 'eared-melon', title: 'Оверклокер', score: '1 850 000', lv: 9 },
    { name: 'GlitchMaster', frame: '', title: 'Виртуоз звука', score: '1 520 000', lv: 8 },
    { name: 'Starlight', frame: '', title: '', score: '1 210 000', lv: 7 }
  ];
  const rowsHtml = others.map((p, i) => {
    const rank = i + 4;
    const tier = rank <= 10 ? 'lb-top-tier' : 'lb-standard-row';
    return `
      <tr class="lb-player-row ${tier} lb-rank-${rank}" data-rank="${rank}">
        <td class="lb-col-rank"><span class="lb-rank-num">#${rank}</span></td>
        <td class="lb-col-player">
          <div class="lb-player-cell">
            <div class="lb-avatar-stage"><div class="lb-avatar-mini ${p.frame ? 'frame-' + p.frame : ''}">${p.name[0]}</div></div>
            <div class="lb-player-info">
              <span class="lb-player-name">${p.name}</span>
              ${p.title ? `<div class="lb-player-title-box"><span class="user-title-badge">${p.title}</span></div>` : ''}
            </div>
          </div>
        </td>
        <td class="lb-col-levels"><span class="lb-stat-levels">${p.lv}</span><span class="lb-stat-levels-sub">ур.</span></td>
        <td class="lb-col-score"><span class="lb-score-val">${p.score}</span></td>
      </tr>
    `;
  }).join('');

  root.innerHTML = `<section class="leaderboard-modal">
    <div class="lb-header-row"><div class="lb-title">♜ ТАБЛИЦА ЛИДЕРОВ</div><button class="lb-close-btn">×</button></div>
    <div class="lb-limit-bar"><span class="lb-limit-label">Лимит:</span><button class="lb-limit-btn active">Топ 25</button><button class="lb-limit-btn">Топ 50</button><button class="lb-limit-btn">Топ 100</button></div>
    <div class="lb-podium-container">${podiumHtml}</div>
    <div class="lb-content-wrapper">
      <div class="lb-scroll-area">
        <table class="lb-table">
          <thead>
            <tr><th class="lb-th-rank">#</th><th class="lb-th-player">Имя</th><th class="lb-th-levels">Уровни</th><th class="lb-th-score">Всего очков</th></tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </div>
  </section>`;
  for(const avatar of root.querySelectorAll('.podium-avatar,.lb-avatar-mini')) avatar.innerHTML='<img class="avatar-photo" src="../../assets/themes/phrolova.png" alt="Preview avatar">';
}
</script>
