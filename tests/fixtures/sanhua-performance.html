<!doctype html><meta charset="utf-8"><title>Ice T5 verification</title>
<style>body{background:#101421;color:#edf0fa;font:14px system-ui}canvas{width:360px;height:640px}button{padding:12px;margin:12px}pre{white-space:pre-wrap}</style>
<button id="bench">Measure 799 → 800 and steady T5</button><pre id="results">Canvas CPU submission; desktop browser, not physical mobile GPU timing.</pre>
<canvas width="360" height="640"></canvas><canvas width="360" height="640"></canvas>
<script type="module">
// Optional baseline: git show BASE:src/game/themes/sanhua.js > tests/fixtures/sanhua-baseline.js
const baseline = new URLSearchParams(location.search).has('baseline');
const {SANHUA_THEME:S}=await import(baseline?'./sanhua-baseline.js':'../../src/game/themes/sanhua.js');
window.GameState={combo:800};
const canvases=[...document.querySelectorAll('canvas')], contexts=canvases.map(c=>c.getContext('2d'));
function scene(ctx,state,time){S.updateAndDrawAtmosphere(ctx,time,1,1,state)}
function show(){[799,800].forEach((combo,i)=>{const ctx=contexts[i];scene(ctx,{combo,gameWidth:360,gameHeight:640},5000);ctx.fillStyle='#fff';ctx.fillText('Combo '+combo,12,20);for(let j=0;j<4;j++){S.bakeTapNote(ctx,12+j*86,180,70,40,false,combo);S.drawHoldBody(ctx,12+j*86,280,70,40,{holding:true,hit:true},false,5000,210,combo,490);S.drawNeck(ctx,12+j*86,490,70,40,{holding:true,hit:true},false,combo);}})}
show();
document.querySelector('#bench').onclick=()=>{
 const out=[];
 for(const mode of ['799','transition','800']){
  const ctx=contexts[0], samples=[];
  const state={combo:mode==='800'?800:799,gameWidth:360,gameHeight:640};
  scene(ctx,state,0);
  for(let i=0;i<30;i++){
   state.combo=mode==='transition'?(i<1?799:800):Number(mode);
   const start=performance.now();
   for(let j=0;j<4;j++)scene(ctx,state,(i*4+j)*16.67);
   samples.push((performance.now()-start)/4);
  }
  samples.sort((a,b)=>a-b);
  out.push(mode+': median '+samples[15].toFixed(3)+' ms; p95 '+samples[28].toFixed(3)+' ms');
 }
 document.querySelector('#results').textContent=(baseline?'BASELINE':'CURRENT')+' — Canvas CPU submission per atmosphere frame\n'+out.join('\n')+'\nPhysical mobile FPS still requires a device measurement.';
 show();
};
</script>
